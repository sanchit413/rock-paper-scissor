<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./css.css">
</head>
<body>
    <h1>Rock Paper Scissors</h1>

    <div class="choices">
        <button type="button" class="choice" id="paper" aria-label="Choose paper">
            <img src="./images/paper.jpeg" alt="Paper">
        </button>
        <button type="button" class="choice" id="rock" aria-label="Choose rock">
            <img src="./images/rock.jpeg" alt="Rock">
        </button>
        <button type="button" class="choice" id="scissors" aria-label="Choose scissors">
            <img src="./images/scissor.jpeg" alt="Scissors">
        </button>
    </div>

    <div class="scoreboard">
        <div class="score">
            <p id="user-score">0</p>
            <p>you</p>
        </div>
        <div class="score">
            <p id="computer-score">0</p>
            <p>computer</p>
        </div>
    </div>

    <div class="message-box">
        <p id="msg">Play your move!</p>
    </div>

    <script src="./js.js"></script>
</body>
</html>
